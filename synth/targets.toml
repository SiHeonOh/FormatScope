# Shared delay targets (build-plan.md S7.2, decision D7).
# T1 = the slowest unconstrained unit's arrival time PLUS its setup requirement,
# rounded up to the next 100 ps; T2 ~= 0.7 x T1. From the unconstrained
# timing.csv row that is period_ps - wns_ps (arrival + setup), so the unit
# meets its own T1 instead of missing it by the setup time. Set once, then
# never change without re-running every synthesis. Values are picoseconds.
#
# The values below were derived before -noalumacc went into the synth
# templates and from arrival alone; re-derive them after the re-run.

[sky130hd]
# Slowest unconstrained unit: fp8e4m3 a24, 48889 ps (OpenSTA 3.1.0, 2026-09-17).
t1_ps = 48900
t2_ps = 34230

